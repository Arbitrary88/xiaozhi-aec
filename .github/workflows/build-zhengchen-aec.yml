name: Build Zhengchen 1.54 TFT AEC

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'main/audio/codecs/no_audio_codec.*'
      - 'main/boards/zhengchen/**'
      - 'main/Kconfig.projbuild'
      - '.github/workflows/build-zhengchen-aec.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Zhengchen 1.54 TFT with AEC
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source $IDF_PATH/export.sh
          python scripts/build.py zhengchen/1.54tft-wifi --zip

      - name: Upload merged binary
        uses: actions/upload-artifact@v4
        with:
          name: zhengchen-1.54tft-wifi-aec-bin
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Upload release zip package
        uses: actions/upload-artifact@v4
        with:
          name: zhengchen-1.54tft-wifi-aec-release-zip
          path: releases/*.zip
          if-no-files-found: warn
